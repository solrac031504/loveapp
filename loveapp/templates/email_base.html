<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name | default("LoveApp") }}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f1f6;">
  <!-- Email clients need table layout and inline styles; <style> blocks are unreliable -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f1f6;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:12px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;">
          <tr>
            <td style="background-color:#d6336c;padding:28px 32px;color:#ffffff;font-size:22px;font-weight:bold;">
              {{ app_name | default("LoveApp") }}
            </td>
          </tr>
          <tr>
            <td style="padding:32px;color:#333333;font-size:16px;line-height:1.6;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;background-color:#faf7fb;color:#888888;font-size:12px;line-height:1.5;">
              {% block footer %}You received this email because you use {{ app_name | default("LoveApp") }}.{% endblock %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
