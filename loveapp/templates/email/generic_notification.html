{% extends "base.html" %}

{% block title %}Notification for {{ current_user.username }}{% endblock %}

{% block content %}
<h2 style="margin:0 0 16px;color:#d6336c;font-size:20px;">Hi {{ current_user.username }},</h2>
<p style="margin:0 0 24px;">{{ message }}</p>

{% if button_url %}
<table role="presentation" cellpadding="0" cellspacing="0">
  <tr>
    <td style="background-color:#d6336c;border-radius:8px;">
      <a href="{{ button_url }}"
        style="display:inline-block;padding:12px 24px;color:#ffffff;text-decoration:none;font-weight:bold;">
        {{ button_text | default("Open") }}
      </a>
    </td>
  </tr>
</table>
{% endif %}
{% endblock %}
